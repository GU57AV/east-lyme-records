name: Archive East Lyme meeting records

on:
  schedule:
    # Every 3 hours. While an initial import is running, each run adds the next batch.
    # After that, one run a day is a full check; the others quickly check current agenda pages.
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      recheck:
        description: "Re-check every archived file for silent changes (slow: one request per document)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets an unfinished initial import start its next batch right away
  issues: write    # posting-deadline and topic alerts

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the newest archive state, even if this run was queued

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr ocrmypdf
          pip install --quiet requests beautifulsoup4 opentimestamps-client

      - name: Run archiver
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          ARGS="--time-budget 300"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.recheck }}" = "true" ]; then ARGS="$ARGS --recheck"; fi
          # Each full run also re-checks the 150 archived documents checked longest ago
          # (current and previous year first) to catch silent replacements.
          ARGS="$ARGS --verify 150"
          python archiver/crawl.py $ARGS

      - name: Check posting deadlines and watched topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_REMINDER_TOPIC: ${{ secrets.NTFY_REMINDER_TOPIC }}
        run: python archiver/compliance.py --open-issues

      - name: Timestamp manifests on the Bitcoin blockchain (OpenTimestamps)
        continue-on-error: true
        run: |
          shopt -s nullglob
          # Stamp any new manifest.
          for f in manifests/*.txt; do
            [ -e "$f.ots" ] || ots stamp "$f" || echo "stamp failed for $f (will retry next run)"
          done
          # Complete earlier proofs once Bitcoin has confirmed them.
          for p in manifests/*.ots; do
            if ! ots info "$p" 2>/dev/null | grep -q "BitcoinBlockHeaderAttestation"; then
              ots upgrade "$p" || true
            fi
          done
          rm -f manifests/*.bak
          python archiver/proofs.py

      - name: Commit changes
        run: |
          git config user.name "east-lyme-records bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A records changes state manifests reports README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Archive update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main
            git push
          fi

      - name: Start the next batch if the initial import is unfinished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('state/state.json')).get('initial_import_complete') else 1)"; then
            echo "Initial import complete."
          else
            gh workflow run archive.yml --ref main -f recheck=false
          fi

      - name: Alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "
          import os, sys; sys.path.insert(0, 'archiver')
          from notify import notify
          notify('East Lyme archive: a run failed', 'Open the run log to see what went wrong.', priority='high', tags=['rotating_light'], click=os.environ['RUN_URL'])
          "
