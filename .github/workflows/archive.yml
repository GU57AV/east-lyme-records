name: Archive East Lyme meeting records

on:
  schedule:
    # Every 3 hours. While the initial import is running, each run adds the next batch.
    # After that, the script only does a full check about once a day and exits early otherwise.
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      recheck:
        description: "Re-download archived files to detect silent changes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the newest archive state, even if this run was queued

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr ocrmypdf
          pip install --quiet requests beautifulsoup4 opentimestamps-client

      - name: Run archiver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS="--time-budget 270"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.recheck }}" = "true" ]; then ARGS="$ARGS --recheck"; fi
          # Weekly recheck on Sundays for silent replacements (uses conditional requests).
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" -lt 3 ]; then ARGS="$ARGS --recheck --force"; fi
          python archiver/crawl.py $ARGS

      - name: Timestamp manifests on the Bitcoin blockchain (OpenTimestamps)
        continue-on-error: true
        run: |
          shopt -s nullglob
          # Stamp any new manifest.
          for f in manifests/*.txt; do
            [ -e "$f.ots" ] || ots stamp "$f" || echo "stamp failed for $f (will retry next run)"
          done
          # Complete earlier proofs once Bitcoin has confirmed them.
          for p in manifests/*.ots; do
            if ! ots info "$p" 2>/dev/null | grep -q "BitcoinBlockHeaderAttestation"; then
              ots upgrade "$p" || true
            fi
          done
          rm -f manifests/*.bak
          python archiver/proofs.py

      - name: Commit changes
        run: |
          git config user.name "east-lyme-records bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A records changes state manifests README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Archive update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main
            git push
          fi
